<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AuditFlow — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h2>🔍 AuditFlow</h2>
        <span>Workflow Management</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item active"><span class="icon">📊</span> Dashboard</a>
        <a href="audit.html" class="nav-item"><span class="icon">📋</span> Audits</a>
        <a href="team.html" class="nav-item"><span class="icon">👥</span> Team</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar" id="user-avatar">?</div>
          <div>
            <div class="name" id="user-name">Loading...</div>
            <div class="role" id="user-role"></div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Sign Out</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <div class="page-header">
        <h1>Dashboard</h1>
        <p>Overview of all audit activities</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">Total Audits</div>
          <div class="value" id="stat-total">—</div>
          <div class="sub">All time</div>
        </div>
        <div class="stat-card">
          <div class="label">Pending</div>
          <div class="value" id="stat-pending">—</div>
          <div class="sub">Awaiting action</div>
        </div>
        <div class="stat-card">
          <div class="label">In Progress</div>
          <div class="value" id="stat-progress">—</div>
          <div class="sub">Active audits</div>
        </div>
        <div class="stat-card">
          <div class="label">Completed</div>
          <div class="value" id="stat-done">—</div>
          <div class="sub">Finished</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Recent Audits</h2>
          <a href="audit.html"><button class="btn btn-sm btn-outline">View All</button></a>
        </div>
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Department</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Created By</th>
            </tr>
          </thead>
          <tbody id="recent-audits-body">
            <tr><td colspan="5"><div class="empty-state"><div class="icon">📭</div><p>No audits yet</p></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/dashboard.js"></script>
</body>
</html>
