<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AuditFlow — Audits</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h2>🔍 AuditFlow</h2>
        <span>Workflow Management</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
        <a href="audit.html" class="nav-item active"><span class="icon">📋</span> Audits</a>
        <a href="team.html" class="nav-item"><span class="icon">👥</span> Team</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar" id="user-avatar">?</div>
          <div>
            <div class="name" id="user-name">Loading...</div>
            <div class="role" id="user-role"></div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <h1>Audits</h1>
          <p>Manage and track all audit tasks</p>
        </div>
        <button class="btn btn-sm" style="margin-top:4px" onclick="openModal()">+ New Audit</button>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Department</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Assigned To</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="audits-body">
            <tr><td colspan="6"><div class="empty-state"><div class="icon">📭</div><p>No audits yet. Create one!</p></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="audit-modal">
    <div class="modal">
      <h2 id="modal-title">New Audit</h2>
      <input type="hidden" id="edit-id" />
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="a-title" placeholder="e.g. Q3 Financial Audit" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="a-desc" placeholder="Brief description..." />
      </div>
      <div class="form-group">
        <label>Department</label>
        <input type="text" id="a-dept" placeholder="e.g. Finance, HR, IT" />
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="a-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="a-status">
          <option value="pending">Pending</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Assign To</label>
        <select id="a-assigned">
          <option value="">— Unassigned —</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-sm" onclick="saveAudit()">Save Audit</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/audit.js"></script>
</body>
</html>
