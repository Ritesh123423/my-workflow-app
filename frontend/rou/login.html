<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — KG Somani ROU Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #1a3a5c;
    --brand-mid: #1e4976;
    --accent: #e8520a;
    --accent-light: #fff3ee;
    --green: #16a34a;
    --red: #dc2626;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1e293b;
    --text2: #475569;
    --text3: #94a3b8;
    --border: #e2e8f0;
    --input-bg: #f8fafc;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image: radial-gradient(ellipse at 20% 50%, rgba(26,58,92,0.06) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 20%, rgba(232,82,10,0.04) 0%, transparent 50%);
  }
  .auth-wrap { width: 100%; max-width: 440px; }
  .brand-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand-logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .brand-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-mid) 100%);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #fff; letter-spacing: -0.5px;
    box-shadow: 0 4px 12px rgba(26,58,92,0.3);
  }
  .brand-name { font-size: 20px; font-weight: 700; color: var(--brand); letter-spacing: -0.3px; }
  .brand-sub { font-size: 12px; color: var(--text3); margin-top: 4px; letter-spacing: 0.2px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .card-top {
    background: linear-gradient(135deg, var(--brand) 0%, #1e4976 100%);
    padding: 28px 32px 24px;
    color: #fff;
  }
  .card-top h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .card-top p { font-size: 13px; color: rgba(255,255,255,0.7); }
  .card-body { padding: 28px 32px 32px; }
  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block; font-size: 12.5px; font-weight: 600;
    color: var(--text2); margin-bottom: 7px; letter-spacing: 0.2px;
  }
  .form-input {
    width: 100%; padding: 11px 14px; font-size: 14px;
    background: var(--input-bg); border: 1.5px solid var(--border);
    border-radius: 8px; color: var(--text); outline: none;
    transition: border-color 0.15s, box-shadow 0.15s; font-family: inherit;
  }
  .form-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26,58,92,0.1); }
  .form-input.error { border-color: var(--red); }
  .input-wrap { position: relative; }
  .input-wrap .toggle-pw {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--text3); font-size: 15px; padding: 2px;
  }
  .error-msg { font-size: 11.5px; color: var(--red); margin-top: 5px; display: none; }
  .error-msg.show { display: block; }
  .alert {
    border-radius: 8px; padding: 12px 14px; font-size: 13px;
    margin-bottom: 18px; display: none; line-height: 1.5;
  }
  .alert.error { background: #fef2f2; border: 1px solid #fecaca; color: var(--red); }
  .alert.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: var(--green); }
  .alert.show { display: block; }
  .btn {
    width: 100%; padding: 12px; font-size: 14px; font-weight: 600;
    border: none; border-radius: 8px; cursor: pointer; font-family: inherit;
    transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-mid) 100%);
    color: #fff; box-shadow: 0 4px 12px rgba(26,58,92,0.3);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(26,58,92,0.35); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .divider span { font-size: 12px; color: var(--text3); white-space: nowrap; }
  .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text2); }
  .footer-link a { color: var(--brand); font-weight: 600; text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }
  .role-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    background: var(--accent-light); color: var(--accent);
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="brand-header">
    <div class="brand-logo">
      <div class="brand-icon">ROU</div>
      <div>
        <div class="brand-name">KG Somani & Co LLP</div>
      </div>
    </div>
    <div class="brand-sub">Ind AS 116 · Right of Use Asset Platform</div>
  </div>

  <div class="card">
    <div class="card-top">
      <h1>Welcome back</h1>
      <p>Sign in to access your workspace</p>
    </div>
    <div class="card-body">
      <div class="alert error" id="alert-error"></div>
      <div class="alert success" id="alert-success"></div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" id="email" type="email" placeholder="you@kgsomani.com" autocomplete="email">
        <div class="error-msg" id="email-err">Please enter a valid email address.</div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password">
          <button class="toggle-pw" type="button" onclick="togglePw('password', this)" tabindex="-1">👁</button>
        </div>
        <div class="error-msg" id="pw-err">Password is required.</div>
      </div>

      <button class="btn btn-primary" id="login-btn" onclick="doLogin()">
        <div class="spinner" id="spinner"></div>
        <span id="btn-text">Sign In</span>
      </button>

      <div class="divider"><span>Don't have an account?</span></div>

      <div class="footer-link">
        <a href="register.html">Create an account</a>
        &nbsp;·&nbsp;
        <span style="color:var(--text3);font-size:12px">Articles can register freely</span>
      </div>
    </div>
  </div>
</div>

<script>
  // Redirect if already logged in
  const token = localStorage.getItem('rou_token');
  if (token) {
    try {
      const p = JSON.parse(atob(token.split('.')[1]));
      if (p.exp * 1000 > Date.now()) window.location.href = 'index.html';
    } catch {}
  }

  function togglePw(id, btn) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
    btn.textContent = el.type === 'password' ? '👁' : '🙈';
  }

  function setLoading(v) {
    document.getElementById('login-btn').disabled = v;
    document.getElementById('spinner').style.display = v ? 'block' : 'none';
    document.getElementById('btn-text').textContent = v ? 'Signing in…' : 'Sign In';
  }

  function showError(msg) {
    const el = document.getElementById('alert-error');
    el.textContent = msg; el.classList.add('show');
    document.getElementById('alert-success').classList.remove('show');
  }

  function clearAlerts() {
    document.getElementById('alert-error').classList.remove('show');
    document.getElementById('alert-success').classList.remove('show');
  }

  async function doLogin() {
    clearAlerts();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) { showError('Please enter your email and password.'); return; }

    setLoading(true);
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await r.json();
      if (!r.ok) { showError(data.error || 'Login failed.'); setLoading(false); return; }
      localStorage.setItem('rou_token', data.token);
      localStorage.setItem('rou_user', JSON.stringify(data.user));
      // Redirect admin to admin panel, others to ROU app
      if (data.user.role === 'admin') window.location.href = 'admin.html';
      else window.location.href = 'index.html';
    } catch {
      showError('Network error. Please check your connection.');
      setLoading(false);
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
