services:
  - type: web
    name: audit-workflow
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: audit-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: audit-db
    plan: free