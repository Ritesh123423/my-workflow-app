services:
  - type: web
    name: audit-workflow
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: audit-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://my-workflow-app.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: audit-db
    plan: free
